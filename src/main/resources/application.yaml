spring:
  application:
    name: samanatteu
  datasource:
    url: jdbc:postgresql://localhost:5432/samanatteu
    username: samanatteu_user
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 900000
  refresh-expiration-ms: 604800000