spring:
  application:
    name: samanatteu
  datasource:
    url: jdbc:postgresql://localhost:5432/samanatteu
    username: samanatteu_user
    password: ${DB_PASSWORD}
  config:
    import: optional:file:.env[.properties]
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  # Flyway modifie la base (db/migration), Hibernate la vérifie (validate).
  flyway:
    # Base déjà remplie sans historique : marquée « version 1 » sans rejouer V1.
    baseline-on-migrate: true
  mail:
    host: localhost
    port: 1025
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

# Activation de l'envoi réel par SMTP (CDC §4.10). Si false ou absent,
# EnvoyeurEmailConsole prend le relais : les emails finissent dans les logs
# et l'application démarre sans serveur SMTP.
# Hors du bloc "spring:" : @ConditionalOnProperty lit la propriété à la racine
# de l'environnement, pas sous le préfixe spring.
samanatteu:
  mail:
    enabled: true
  # Indicatif pays utilisé pour convertir un numéro local en E.164.
  # C'est le SEUL endroit où le pays de la plateforme est écrit : tous les
  # appelants passent par IndicatifPays. Quand la plateforme servira plusieurs
  # pays, seule cette valeur changera de source (le pays du tenant).
  pays-defaut: "+221"
  # L'adresse du front Angular : les liens envoyés par email (vérification de
  # l'adresse) pointent vers ses pages. En production : FRONT_URL dans le .env.
  front-url: ${FRONT_URL:http://localhost:4200}
  # Envoi réel des SMS par Twilio (CDC §4.10). Si enabled=false ou absent,
  # EnvoyeurSmsConsole prend le relais : les SMS finissent dans les logs et
  # l'application démarre sans compte Twilio.
  # Le défaut est false (dépôt utilisable par tout le monde) ; on l'active
  # localement en mettant TWILIO_ENABLED=true dans le .env.
  sms:
    twilio:
      enabled: ${TWILIO_ENABLED:false}
      # Les identifiants viennent du .env (jamais dans le dépôt).
      account-sid: ${TWILIO_ACCOUNT_SID:}
      auth-token: ${TWILIO_AUTH_TOKEN:}
      # Le numéro qui envoie les SMS, au format E.164.
      from: ${TWILIO_FROM:}

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 900000
  refresh-expiration-ms: 604800000
