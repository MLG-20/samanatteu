spring:
  application:
    name: samanatteu
  datasource:
    url: jdbc:postgresql://localhost:5432/samanatteu
    username: samanatteu_user
    password: ${DB_PASSWORD}
  config:
    import: optional:file:.env[.properties]
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  # Flyway modifie la base (db/migration), Hibernate la vérifie (validate).
  flyway:
    # Base déjà remplie sans historique : marquée « version 1 » sans rejouer V1.
    baseline-on-migrate: true
  mail:
    host: localhost
    port: 1025
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

# Activation de l'envoi réel par SMTP (CDC §4.10). Si false ou absent,
# EnvoyeurEmailConsole prend le relais : les emails finissent dans les logs
# et l'application démarre sans serveur SMTP.
# Hors du bloc "spring:" : @ConditionalOnProperty lit la propriété à la racine
# de l'environnement, pas sous le préfixe spring.
samanatteu:
  mail:
    enabled: true

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 900000
  refresh-expiration-ms: 604800000
